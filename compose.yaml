name: chongmuya

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: chongmuya
      POSTGRES_PASSWORD: chongmuya_local
      POSTGRES_DB: chongmuya
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chongmuya -d chongmuya"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
