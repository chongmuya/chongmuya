# Initial Ubuntu sites-available template. Certbot manages the TLS blocks on host.
# Never installed or overwritten by application deployments.
log_format api_safe '$time_iso8601 $request_id $request_method $uri $status '
                    '$upstream_status $request_time $upstream_http_x_request_id';
server {
    listen 80;
    server_name api.chongmuya.com;
    client_max_body_size 256k;
    access_log /var/log/nginx/api-access.log api_safe;
    # Nginx error messages can contain the entire request URI, including callback
    # code/state even when access_log is sanitized. Use status + Nest request IDs.
    error_log /dev/null;
    if ($host != api.chongmuya.com) { return 444; }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
