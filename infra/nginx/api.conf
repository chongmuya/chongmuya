# Included inside nginx.conf's http block. Query/header/body values are never logged.
log_format api_safe '$time_iso8601 $request_id $request_method $uri $status '
                    '$upstream_status $request_time $upstream_http_x_request_id';
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null;
    return 444;
}
server {
    listen 80;
    server_name api.chongmuya.com;
    access_log /var/log/nginx/api-access.log api_safe;
    error_log /dev/null;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://api.chongmuya.com$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    error_log /dev/null;
}
server {
    listen 443 ssl;
    server_name api.chongmuya.com;
    ssl_certificate /etc/letsencrypt/live/api.chongmuya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chongmuya.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    access_log /var/log/nginx/api-access.log api_safe;
    # Nginx error messages can contain the entire request URI, including callback
    # code/state even when access_log is sanitized. Use status + Nest request IDs.
    error_log /dev/null;
    if ($host != api.chongmuya.com) { return 444; }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
