# Initial Ubuntu sites-available template. Certbot manages the TLS blocks on host.
# Never installed or overwritten by application deployments.
log_format api_safe '$time_iso8601 $request_id $request_method $uri $status '
                    '$upstream_status $request_time $upstream_http_x_request_id';
server {
    listen 80;
    server_name api.chongmuya.com;
    client_max_body_size 256k;
    access_log /var/log/nginx/api-access.log api_safe;
    error_log /var/log/nginx/api-error.log warn;
    if ($host != api.chongmuya.com) { return 444; }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    # File size is enforced again by the API at 10 MiB. The extra MiB admits
    # multipart headers; other routes retain the 256 KiB request limit.
    location ~* ^/api/v1/events/[^/]+/files/[^/]+/upload/?$ {
        client_max_body_size 11m;
        client_body_timeout 90s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:3001;
    }
    location ~* ^/api/v1/events/[^/]+/files/[^/]+/(download|delete)/?$ {
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:3001;
    }
    # Express accepts case variants and a trailing slash. Callback query secrets
    # must not reach Nginx's unredacted error log, even on upstream failure.
    location ~* ^/api/v1/auth/kakao/callback/?$ {
        error_log /dev/null;
        proxy_pass http://127.0.0.1:3001;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
