# Install this HTTP-only configuration before obtaining the first certificate.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null;
    return 444;
}
server {
    listen 80;
    server_name api.chongmuya.com;
    access_log off;
    error_log /dev/null;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / { return 503; }
}
