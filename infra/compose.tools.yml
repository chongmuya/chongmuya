name: chongmuya
services:
  migrate:
    profiles: ["tools"]
    image: ${API_IMAGE:?API_IMAGE required}
    platform: linux/amd64
    env_file:
      - path: ${TOOLS_ENV_FILE:?TOOLS_ENV_FILE required}
        format: raw
    volumes:
      - type: bind
        source: ${RDS_CA_FILE:?RDS_CA_FILE required}
        target: /run/certs/rds-global-bundle.pem
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
    command: ["node", "scripts/migrate.mjs"]
  restaurant-data:
    profiles: ["tools"]
    image: ${API_IMAGE:?API_IMAGE required}
    platform: linux/amd64
    env_file:
      - path: ${TOOLS_ENV_FILE:?TOOLS_ENV_FILE required}
        format: raw
    volumes:
      - type: bind
        source: ${RDS_CA_FILE:?RDS_CA_FILE required}
        target: /run/certs/rds-global-bundle.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_INPUT_FILE:-/dev/null}
        target: /run/input.json
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
    command: ["node", "scripts/restaurant-data.mjs", "--help"]
