name: Rollback API
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Retained successful release ID (from Deploy API summary)
        required: true
        type: string
      schema_compatible:
        description: I verified this version is compatible with the current DB schema and latest settings
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-api
  cancel-in-progress: false
jobs:
  rollback:
    if: github.repository == 'chongmuya/chongmuya' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    env:
      AWS_REGION: ap-northeast-2
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify rollback authorization
        env:
          CONFIRMED: ${{ inputs.schema_compatible }}
          RELEASE: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          [[ $GITHUB_REPOSITORY == chongmuya/chongmuya && $GITHUB_REF == refs/heads/main && $GITHUB_EVENT_NAME == workflow_dispatch ]] || exit 1
          test "$CONFIRMED" = true || { echo 'DB schema/settings compatibility confirmation is required.'; exit 1; }
          [[ $RELEASE =~ ^[a-zA-Z0-9_-]+$ ]]
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.API_PUBLISH_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: api-rollback-${{ github.run_id }}
      - name: Roll back on EC2 and verify HTTPS
        env:
          OPERATION: rollback
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: node infra/ssm-command.mjs
