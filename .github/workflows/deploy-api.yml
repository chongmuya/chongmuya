name: Deploy API
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: production-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'chongmuya/chongmuya' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      TARGET_SHA: ${{ github.sha }}
      AWS_REGION: ap-northeast-2
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Require successful main CI for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash infra/verify-main.sh
          [[ $AWS_ACCOUNT_ID =~ ^[0-9]{12}$ ]]
          [[ $ECR_REPOSITORY =~ ^[a-z0-9][a-z0-9._/-]*$ ]]
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.API_PUBLISH_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: api-deploy-${{ github.run_id }}
      - name: Build and push immutable API image
        id: image
        run: |
          set -euo pipefail
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$TARGET_SHA" \
            > "$RUNNER_TEMP/existing-image.json" 2> "$RUNNER_TEMP/ecr-error"; then
            digest=$(jq -er '.imageDetails[0].imageDigest' "$RUNNER_TEMP/existing-image.json")
            echo 'This SHA already has an image; reusing its digest without overwriting the tag.'
          elif grep -q '(ImageNotFoundException)' "$RUNNER_TEMP/ecr-error"; then
            docker buildx create --use --driver docker-container
            docker buildx build --platform linux/amd64 --push \
              --file apps/api/Dockerfile --tag "$registry/$ECR_REPOSITORY:$TARGET_SHA" \
              --label "org.opencontainers.image.revision=$TARGET_SHA" \
              --metadata-file "$RUNNER_TEMP/api-image.json" .
            digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/api-image.json")
          else
            cat "$RUNNER_TEMP/ecr-error" >&2
            exit 1
          fi
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          image="$registry/$ECR_REPOSITORY@$digest"
          docker pull --platform linux/amd64 "$image"
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$TARGET_SHA"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - name: Deploy on EC2 and verify HTTPS
        id: ssm
        env:
          OPERATION: deploy
          SOURCE_SHA: ${{ env.TARGET_SHA }}
          API_IMAGE: ${{ steps.image.outputs.image }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: node infra/ssm-command.mjs
      - name: Report pre-SSM failure
        if: failure() && steps.ssm.outcome == 'skipped'
        env:
          IMAGE_RESULT: ${{ steps.image.outcome }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          printf 'Commit: %s\nInstance: %s\nBuild/push: %s\nSSM: not started\n' "$TARGET_SHA" "$INSTANCE_ID" "$IMAGE_RESULT" >> "$GITHUB_STEP_SUMMARY"
